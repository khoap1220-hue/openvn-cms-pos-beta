<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>OPENVN Shopee Auto-Sync</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 340px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      font-size: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .brand {
      font-size: 14px;
      font-weight: 700;
      color: #ea580c;
    }
    .shop-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #9a3412;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 11px;
      margin-bottom: 10px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 0;
      gap: 8px;
    }
    .label { color: #64748b; }
    .val { font-weight: 600; text-align: right; word-break: break-all; }
    .ok { color: #059669; }
    .warn { color: #d97706; }
    .err { color: #dc2626; }
    .error-box {
      margin-top: 6px;
      padding: 7px 8px;
      border-radius: 6px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      font-size: 11px;
      line-height: 1.4;
      display: none;
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 9px 12px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.6; cursor: wait; }
    .btn-primary {
      background: #ea580c;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .btn-primary:hover { background: #c2410c; }
    .btn-secondary {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
    }
    .btn-secondary:hover { background: #e2e8f0; }
    details {
      margin-top: 8px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 10px;
    }
    summary {
      cursor: pointer;
      font-weight: 600;
      color: #334155;
      user-select: none;
    }
    .field { margin-top: 8px; }
    .field label {
      display: block;
      font-size: 11px;
      color: #475569;
      margin-bottom: 3px;
    }
    .field input[type="text"],
    .field input[type="password"] {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 11px;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      font-size: 11px;
      color: #334155;
    }
    .hint {
      margin-top: 8px;
      font-size: 11px;
      color: #64748b;
      text-align: center;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">OPENVN Auto-Sync</div>
    <div id="shopBadge" class="shop-pill">Shop #197195817</div>
  </div>

  <div class="card">
    <div class="row">
      <span class="label">Trạng thái:</span>
      <span id="status" class="val">Đang kiểm tra...</span>
    </div>
    <div class="row">
      <span class="label">Tài khoản nhận diện:</span>
      <span id="detectedShop" class="val">—</span>
    </div>
    <div class="row">
      <span class="label">Số lượng Cookie:</span>
      <span id="count" class="val">0</span>
    </div>
    <div class="row">
      <span class="label">Kênh truyền:</span>
      <span id="channel" class="val">—</span>
    </div>
    <div class="row">
      <span class="label">Đồng bộ cuối:</span>
      <span id="time" class="val">Chưa chạy</span>
    </div>
    <div id="errorBox" class="error-box"></div>
  </div>

  <button id="syncBtn" class="btn btn-primary">Đồng bộ Cookie ngay</button>
  <button id="copyBtn" class="btn btn-secondary">Sao chép chuỗi Cookie (dán thủ công)</button>

  <details>
    <summary>Cấu hình liên kết Shop</summary>
    <div class="field">
      <label for="cmsOriginInput">Địa chỉ OPENVN CMS</label>
      <input id="cmsOriginInput" type="text" placeholder="http://127.0.0.1:3010" />
    </div>
    <div class="field">
      <label for="pairingTokenInput">Mã liên kết API (Pairing Token)</label>
      <input id="pairingTokenInput" type="password" placeholder="Tự động điền sẵn theo Shop" />
    </div>
    <label class="checkbox-row">
      <input id="shopLockCheckbox" type="checkbox" checked />
      <span id="shopLockLabel">Khóa cứng chỉ nhận đúng Shop liên kết</span>
    </label>
    <button id="saveSettingsBtn" class="btn btn-secondary" style="margin-top: 8px;">Lưu & Kết nối lại</button>
  </details>

  <div class="hint">
    Tự động gia hạn mỗi 10 phút hoặc ngay khi bạn mở <b>banhang.shopee.vn</b>.
  </div>

  <script src="popup.js"></script>
</body>
</html>

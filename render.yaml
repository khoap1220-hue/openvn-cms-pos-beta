# Blueprint Render Free Tier (Singapore) - OPENVN CMS & Shopee 24/7 Session Vault Service
services:
  - type: web
    name: openvn-cms-pos-backend
    runtime: docker
    region: singapore
    plan: free
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: BETA_MODE
        value: "true"
      - key: NODE_ENV
        value: "production"
      - key: CMS_REQUIRE_AUTH
        value: "true"
      - key: SHOPEE_NODE_ROLE
        value: "CLOUD_RENDER"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CMS_ADMIN_PASSWORD
        sync: false
      - key: CMS_API_KEY
        sync: false
      # Lưu ý: Khóa AES-256-GCM được dẫn xuất tự động 256-bit (HKDF-SHA256) từ thông tin xác thực DATABASE_URL
      # đồng bộ 100% giữa Máy bán hàng & Cloud mà không cần nhập thêm SHOPEE_SESSION_VAULT_KEY thủ công.

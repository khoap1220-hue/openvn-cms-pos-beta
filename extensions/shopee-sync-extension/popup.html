<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>OPENVN Shopee Sync</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 340px; background: #0f172a; color: #f8fafc; padding: 16px; }
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1e293b; padding-bottom: 12px; margin-bottom: 14px; }
    .title { font-size: 14px; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
    .badge { font-size: 10px; padding: 2px 8px; border-radius: 999px; font-weight: 600; text-transform: uppercase; }
    .badge-active { background: #065f46; color: #34d399; border: 1px solid #059669; }
    .badge-error { background: #7f1d1d; color: #f87171; border: 1px solid #dc2626; }
    .card { background: #1e293b; border-radius: 8px; padding: 12px; margin-bottom: 12px; border: 1px solid #334155; }
    .row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; }
    .row:last-child { margin-bottom: 0; }
    .label { color: #94a3b8; }
    .value { font-weight: 600; color: #e2e8f0; }
    .btn { display: block; width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; text-align: center; text-decoration: none; }
    .btn-primary { background: #2563eb; color: #fff; margin-bottom: 8px; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-outline { background: transparent; border: 1px solid #334155; color: #94a3b8; }
    .btn-outline:hover { background: #334155; color: #fff; }
    .status-msg { font-size: 11px; text-align: center; margin-top: 10px; color: #64748b; line-height: 1.4; }
    .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s ease-in-out infinite; vertical-align: middle; margin-right: 4px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">⚡ OPENVN Shopee Sync</div>
    <div id="statusBadge" class="badge badge-active">HOẠT ĐỘNG</div>
  </div>

  <div class="card">
    <div class="row">
      <span class="label">Shop Shopee:</span>
      <span id="shopName" class="value">thaimy1605</span>
    </div>
    <div class="row">
      <span class="label">Shop ID:</span>
      <span id="shopId" class="value">197195817</span>
    </div>
    <div class="row">
      <span class="label">Trạng thái:</span>
      <span id="syncText" class="value" style="color: #34d399;">Đã đồng bộ</span>
    </div>
    <div class="row">
      <span class="label">Lần cuối:</span>
      <span id="lastTime" class="value">Vừa xong</span>
    </div>
  </div>

  <button id="btnSync" class="btn btn-primary">Đồng bộ Cookie ngay</button>
  <a href="https://banhang.shopee.vn" target="_blank" class="btn btn-outline">Mở Kênh Người Bán Shopee</a>

  <div id="hintMsg" class="status-msg">
    Tự động bắt cookie phiên & gia hạn liên tục cho OPENVN POS mỗi khi bạn bán hàng.
  </div>

  <script src="popup.js"></script>
</body>
</html>

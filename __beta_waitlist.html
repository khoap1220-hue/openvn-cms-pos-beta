<!DOCTYPE html>
<html lang="vi">
<head>

  <title>Phiên bản Beta Tạm Đóng • Waitlist</title>
  <style>
    :root { color-scheme: dark; }

    body {
      margin: 0;

      display: grid;
      place-items: center;
      padding: 24px;

      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.16);
      border: 1px solid rgba(96, 165, 250, 0.35);
      color: #93c5fd;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    h1 { margin: 0 0 12px; font-size: 24px; line-height: 1.3; }
    p { margin: 0 0 20px; color: #94a3b8; font-size: 15px; line-height: 1.6; }
    .meta {
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.7);
      color: #cbd5e1;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="card">

    <div class="meta">Mã phiên bản: <strong>beta-openvn-cms-pos-beta-a74831</strong></div>
  </main>
</body>
</html>

services:
  omnisales-cms:
    build: .
    container_name: omnisales-cms
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - DATABASE_URL=file:/app/db/custom.db
      - REALTIME_PORT=3003
      - REALTIME_URL=http://localhost:3003
      - NEXT_PUBLIC_REALTIME_PORT=3003
      - CMS_ADMIN_PASSWORD=${CMS_ADMIN_PASSWORD:-admin}
    volumes:
      - ./db:/app/db
